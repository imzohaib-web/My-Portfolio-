      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <pattern id="cardGrid-hybrid-movie-recommender" width="40" height="40" patternUnits="userSpaceOnUse">
