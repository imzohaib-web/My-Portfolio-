  <circle cx="600" cy="240" r="280" fill="url(#cardGlow-synthex-ai)" />

  <!-- Connecting Arrows -->
  
    <g>
      <line x1="232" y1="240" x2="522" y2="240" stroke="#71717a" stroke-width="3" stroke-dasharray="6,6" />
      <circle cx="518" cy="240" r="5" fill="#22d3ee" />
    </g>

    <g>
      <line x1="692" y1="240" x2="982" y2="240" stroke="#71717a" stroke-width="3" stroke-dasharray="6,6" />
      <circle cx="978" cy="240" r="5" fill="#22d3ee" />
    </g>

  <!-- Nodes -->
  
    <g>
      <rect x="48" y="190" width="184" height="100" rx="20" fill="#22d3ee" fill-opacity="0.20" stroke="#22d3ee" stroke-opacity="0.70" stroke-width="2.5" />
      <text x="140" y="251" text-anchor="middle" fill="#f4f4f5" font-family="Inter, -apple-system, system-ui, sans-serif" font-weight="700" font-size="34" letter-spacing="0.03em">Chat UI</text>
    </g>

    <g>
