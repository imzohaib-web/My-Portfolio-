      <text x="607" y="251" text-anchor="middle" fill="#f4f4f5" font-family="Inter, -apple-system, system-ui, sans-serif" font-weight="700" font-size="34" letter-spacing="0.03em">API</text>
    </g>

    <g>
      <rect x="982" y="190" width="170" height="100" rx="20" fill="#22d3ee" fill-opacity="0.20" stroke="#22d3ee" stroke-opacity="0.70" stroke-width="2.5" />
      <text x="1067" y="251" text-anchor="middle" fill="#f4f4f5" font-family="Inter, -apple-system, system-ui, sans-serif" font-weight="700" font-size="34" letter-spacing="0.03em">Gemini</text>
